apiVersion: apps/v1
kind: Deployment
metadata:
  name: master-service
  namespace: bbhealthapp
  labels:
    app: master-service
    app.kubernetes.io/name: master-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bbhealthapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: master-service
  template:
    metadata:
      labels:
        app: master-service
        app.kubernetes.io/name: master-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: bbhealthapp
    spec:
      containers:
        - name: master-service
          image: bbhealthapp-master-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: bbhealthapp-config
                  key: SPRING_PROFILES_ACTIVE
            - name: token.secret
              valueFrom:
                secretKeyRef:
                  name: bbhealthapp-secret
                  key: TOKEN_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: master-uploads
              mountPath: /app/useruploads
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: master-uploads
          persistentVolumeClaim:
            claimName: master-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: master-service
  namespace: bbhealthapp
  labels:
    app: master-service
    app.kubernetes.io/name: master-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bbhealthapp
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  selector:
    app: master-service
