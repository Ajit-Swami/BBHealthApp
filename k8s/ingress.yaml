apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bbhealthapp-ingress
  namespace: bbhealthapp
  labels:
    app.kubernetes.io/name: bbhealthapp
    app.kubernetes.io/part-of: bbhealthapp
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: master-service
                port:
                  number: 8081
          - path: /api/master
            pathType: Prefix
            backend:
              service:
                name: master-service
                port:
                  number: 8081
          - path: /api/register
            pathType: Prefix
            backend:
              service:
                name: register-service
                port:
                  number: 8082
          - path: /documents
            pathType: Prefix
            backend:
              service:
                name: document-service
                port:
                  number: 8083
          - path: /api/document
            pathType: Prefix
            backend:
              service:
                name: document-service
                port:
                  number: 8083
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
